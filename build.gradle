plugins {
    id 'application'
}

/**
 * Gloom Rebirth — vue 3D temps réel (jMonkeyEngine) du portage Java de Gloom.
 *
 * Ce projet ne contient QUE le code propre à la 3D (src/gloom/rebirth). La simulation (gameplay,
 * IA, maps, audio, script…) est celle du portage fidèle : ses sources sont compilées telles quelles
 * depuis le projet voisin ../gloom-java/src — partagées, pas copiées.
 */

repositories {
    mavenCentral()
}

ext {
    lwjglVersion = '3.3.4'
    lwjglNatives = 'natives-windows'
    jmeVersion = '3.6.1-stable'
    // sources du moteur partagé (portage fidèle)
    engineSrc = file('../gloom-java/src')
}

dependencies {
    // LWJGL : utilisé directement par le moteur partagé (host.Audio = OpenAL) et par DesktopGlue (GLFW)
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-openal'
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"

    // jMonkeyEngine 3 (backend LWJGL3)
    implementation "org.jmonkeyengine:jme3-core:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-desktop:$jmeVersion"   // AWTLoader, Screenshots
    implementation "org.jmonkeyengine:jme3-effects:$jmeVersion"   // FogFilter, BloomFilter
    runtimeOnly    "org.jmonkeyengine:jme3-lwjgl3:$jmeVersion"     // backend LWJGL3 + natives
}

sourceSets {
    main {
        java {
            srcDirs = ['src', engineSrc]
            // Du moteur partagé on ne prend que la simulation et la pile hôte réutilisée
            // (Audio, Font, Game, LevelScene, Splat…) : pas le lanceur 2D ni ses harnais.
            exclude 'gloom/tools/**'
            exclude 'gloom/host/Main.java'
            exclude 'gloom/host/DisplayTest.java'
        }
        // incbin de compilation de gloom.s (tables, sprites intégrés), embarqués par gloom-java
        resources {
            srcDirs = [engineSrc]
            include 'gloom/data/incbin/*'
            exclude '**/README.md'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

base {
    archivesName = 'gloom-rebirth'
}

application {
    mainClass = 'gloom.rebirth.Rebirth'
    applicationName = 'GloomRebirth'
}

// Racine d'exécution = gloom-rebirth/ (ce projet) : les assets sont lus dans ../GloomAmiga (défaut de
// gloom.Assets), les textures HD dans ./hd/<épisode>/ ou ../rebirth-docs/gloom-rebirth/hd/.
def runRoot = projectDir

tasks.named('run') {
    workingDir = runRoot
    systemProperties System.getProperties().subMap(['shot', 'map', 'tile', 'speed', 'mousesens', 'fov'])
}

// Source des données : disquettes Gloom Deluxe (cf. gloom.boot.Disks) ou dossier (-Dgloom.assets=).
tasks.withType(JavaExec).configureEach {
    systemProperties System.getProperties().subMap(['gloom.adf', 'gloom.assets', 'gloom.noDownload'])
}

// Alias historique : `gradle rebirth` (= run).
tasks.register('rebirth', JavaExec) {
    group = 'application'
    description = 'Vue 3D Gloom Rebirth (jMonkeyEngine). -Dshot = capture rebirth.png puis quitte'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'gloom.rebirth.Rebirth'
    workingDir = runRoot
    systemProperties System.getProperties().subMap(['shot', 'map', 'tile', 'speed', 'mousesens', 'fov'])
}

// Extrait les textures d'un niveau en PNG (base) → hd_src/<épisode>/, entrée de scripts/upscale-textures.py.
tasks.register('dumpTextures', JavaExec) {
    group = 'application'
    description = 'Extrait les textures du niveau en PNG → hd_src/ (entrée de l\'upscale HD)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'gloom.rebirth.tools.TextureDump'
    workingDir = runRoot
    systemProperties System.getProperties().subMap(['map', 'tile', 'out'])
}

// ===========================================================================
// Distribution native autonome (jpackage) — même principe que gloom-java : moteur + jME + JRE
// embarqués, AUCUNE donnée de jeu ; au premier lancement, le jeu cherche les disquettes Gloom
// Deluxe ($APPDIR/adf, ~/.gloom-java/adf…) ou propose de les télécharger (rien sans un oui).
// ===========================================================================
def appVersion = '0.7'
def jpackageInputDir = layout.buildDirectory.dir('jpackage-input')
def jpackageOutDir = layout.buildDirectory.dir('jpackage')
def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
def jpackageTool = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
        .get().metadata.installationPath.file('bin/jpackage' + (isWindows ? '.exe' : '')).asFile

tasks.register('jpackageStage', Copy) {
    group = 'distribution'
    description = "Prépare l'entrée jpackage (jar + jME + natives LWJGL)"
    dependsOn tasks.named('jar')
    doFirst { delete jpackageInputDir.get().asFile }
    into jpackageInputDir
    from(tasks.named('jar').flatMap { it.archiveFile })
    from(configurations.runtimeClasspath)
}

tasks.register('jpackage', Exec) {
    group = 'distribution'
    description = 'Crée une app native autonome (build/jpackage/GloomRebirth) : JRE embarqué'
    dependsOn tasks.named('jpackageStage')
    doFirst {
        delete jpackageOutDir.get().dir('GloomRebirth').asFile
        jpackageOutDir.get().asFile.mkdirs()
    }
    commandLine jpackageTool.absolutePath,
            '--type', 'app-image',
            '--name', 'GloomRebirth',
            '--app-version', appVersion,
            '--vendor', 'Guillaume Monet',
            '--copyright', 'Moteur (c) Black Magic Software 1995 - portage Java et vue 3D Guillaume Monet',
            '--description', 'Gloom Rebirth - vue 3D du portage Java de Gloom, par Guillaume Monet',
            '--input', jpackageInputDir.get().asFile.absolutePath,
            '--main-jar', tasks.named('jar').get().archiveFileName.get(),
            '--main-class', 'gloom.rebirth.Rebirth',
            '--dest', jpackageOutDir.get().asFile.absolutePath,
            '--java-options', '-Dgloom.appdir=$APPDIR',
            '--java-options', '-Xmx1g'
}

// Archive de release Windows → build/release/GloomRebirth-<version>-windows-x64.zip
tasks.register('releaseZip', Zip) {
    group = 'distribution'
    description = 'Zippe l\'app native (jpackage) pour une release GitHub'
    dependsOn tasks.named('jpackage')
    from(jpackageOutDir.map { it.dir('GloomRebirth') }) { into 'GloomRebirth' }
    archiveFileName = "GloomRebirth-${appVersion}-windows-x64.zip"
    destinationDirectory = layout.buildDirectory.dir('release')
}
